<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sprich mit Hansi — German Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FAFAFA;
            color: #000;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            max-width: 640px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #E0E0E0;
            background: #FAFAFA;
        }
        header a {
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 16px;
        }
        header .title { font-size: 14px; color: #555; }
        header button {
            background: none;
            border: 1px solid #ccc;
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            color: #333;
        }
        header button.muted { opacity: 0.45; text-decoration: line-through; }

        /* Scene with Hansi */
        .scene {
            flex-shrink: 0;
            line-height: 0;
            background: linear-gradient(#7EC8F5, #B8E2FA);
        }
        .scene svg { width: 100%; height: auto; max-height: 34dvh; display: block; }

        /* Chat */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.45;
            white-space: pre-wrap;
        }
        .msg.user {
            align-self: flex-end;
            background: #000;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.hansi {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #E0E0E0;
            border-bottom-left-radius: 4px;
        }
        .msg.correction {
            align-self: flex-start;
            background: #FFF7E0;
            border: 1px solid #F0DFA8;
            font-size: 13.5px;
            color: #4a3f14;
        }
        .msg.correction .fixed { font-weight: 600; display: block; margin-bottom: 3px; }
        .msg.thinking { color: #999; font-style: italic; background: #fff; border: 1px solid #eee; align-self: flex-start; }

        /* Input bar */
        .inputbar {
            display: flex;
            gap: 8px;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid #E0E0E0;
            background: #FAFAFA;
        }
        .inputbar input {
            flex: 1;
            font-family: inherit;
            font-size: 16px;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 24px;
            outline: none;
            background: #fff;
        }
        .inputbar input:focus { border-color: #000; }
        .inputbar button {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: #000;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .inputbar button:disabled { opacity: 0.4; }

        /* Password modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
        }
        .modal h2 { font-size: 17px; margin-bottom: 8px; }
        .modal p { font-size: 14px; color: #555; margin-bottom: 16px; line-height: 1.5; }
        .modal input {
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
        .modal button {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }
        .modal button.primary { background: #000; color: #fff; border-color: #000; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <a href="/">Mike Burns</a>
        <span class="title">Sprich mit Hansi 🇩🇪</span>
        <button id="ttsToggle" title="Toggle voice">🔊 Voice</button>
    </header>

    <div class="scene">
        <svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated man in lederhosen in front of the Alps">

                .drift-b { animation: driftB 40s ease-in-out infinite alternate; }

                @keyframes driftB { from { transform: translateX(0); } to { transform: translateX(-34px); } }
                #lids { opacity: 0; animation: blink 6s infinite; }
                @keyframes blink { 0%, 94%, 100% { opacity: 0; } 95.5%, 98% { opacity: 1; } }
            </style>
            <defs>
                <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#3E96DD"/>
                    <stop offset="0.55" stop-color="#8CC6EF"/>
                    <stop offset="1" stop-color="#DDEFFA"/>
                </linearGradient>
                <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0" stop-color="#FFF3C0" stop-opacity="0.95"/>
                    <stop offset="0.55" stop-color="#FFF3C0" stop-opacity="0.35"/>
                    <stop offset="1" stop-color="#FFF3C0" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="mFar" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#C6D8E6"/>
                    <stop offset="1" stop-color="#DFEAF3"/>
                </linearGradient>
                <linearGradient id="mMid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#93AFC4"/>
                    <stop offset="1" stop-color="#B7CBDA"/>
                </linearGradient>
                <linearGradient id="meadowG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#93CC74"/>
                    <stop offset="1" stop-color="#5E9C4C"/>
                </linearGradient>
                <linearGradient id="meadowG2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#7FBB61"/>
                    <stop offset="1" stop-color="#52903F"/>
                </linearGradient>
                <radialGradient id="skinG" cx="0.5" cy="0.38" r="0.75">
                    <stop offset="0" stop-color="#FFDDB4"/>
                    <stop offset="0.75" stop-color="#F7C89A"/>
                    <stop offset="1" stop-color="#EDB588"/>
                </radialGradient>
                <linearGradient id="hatG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#6CA057"/>
                    <stop offset="1" stop-color="#4A7A3B"/>
                </linearGradient>
                <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#FFFFFF"/>
                    <stop offset="1" stop-color="#E7E1D3"/>
                </linearGradient>
                <linearGradient id="leatherG" x1="0" y1="0" x2="0" y2="1">

                    <stop offset="1" stop-color="#77553A"/>

                <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
                <filter id="blur4" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>

            <!-- sky -->

            <!-- clouds -->

                <g transform="translate(410,296)"><circle r="2.6" fill="#FFFFFF"/><circle r="1.1" fill="#F5C518"/></g>
            </g>

            <g id="hansi">

                <!-- torso: trapezius, deltoids, arms in one silhouette -->

                         C228 260 236 226 252 206
                         C262 192 276 182 294 172

                         L336 160
                         C336 165 340 169 346 172
                         C364 182 378 192 388 206

                <path d="M382 210 Q402 250 404 300 L390 300 Q388 254 372 218 Z" fill="#D8D0BF" opacity="0.4" filter="url(#blur2)"/>

                <!-- collar -->
                <path d="M300 160 Q298 172 304 180 L320 172 L314 160 Z" fill="#FFFFFF"/>

                <ellipse cx="347" cy="121" rx="8" ry="5" fill="#F09B7E" opacity="0.25" filter="url(#blur2)"/>

                <!-- alpine hat -->
                <path d="M280 74 Q280 34 320 28 Q360 34 360 74 Q320 60 280 74 Z" fill="url(#hatG)"/>
                <path d="M298 33 Q320 27 344 32 Q356 38 358 60 Q340 40 298 33 Z" fill="#7DB268" opacity="0.5"/>
                <path d="M304 34 Q320 29 336 34" fill="none" stroke="#3F6A32" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
                <path d="M262 78 Q320 58 378 78 Q378 90 366 91 Q320 74 274 91 Q262 90 262 78 Z" fill="#456F37"/>
                <path d="M262 78 Q320 58 378 78 Q377 82 372 84 Q320 66 268 84 Q263 82 262 78 Z" fill="#549044" opacity="0.7"/>
                <path d="M283 72 Q320 58 357 72 Q357 77 353 79 Q320 65 287 79 Q283 77 283 72 Z" fill="#2F4E26"/>
                <circle cx="294" cy="71" r="3.2" fill="#E5C48F"/>
                <!-- feather -->
                <g>
                    <path d="M347 50 Q359 24 379 10 Q377 32 359 56 Q351 55 347 50 Z" fill="#F3F0E8"/>
                    <path d="M347 50 Q359 24 379 10 Q371 30 357 52 Q351 52 347 50 Z" fill="#DDD6C6" opacity="0.7"/>
                    <path d="M351 49 Q363 32 374 18" fill="none" stroke="#C0B8A6" stroke-width="1.6" stroke-linecap="round"/>
                </g>
            </g>
        </svg>
    </div>

    <div class="chat" id="chat"></div>

    <form class="inputbar" id="form">
        <input id="input" type="text" placeholder="Schreib etwas auf Deutsch…" autocomplete="off" enterkeyhint="send">
        <button type="submit" id="send" aria-label="Send">➤</button>
    </form>
</div>

<div class="modal-backdrop" id="modal">
    <div class="modal">
        <h2>Daily limit reached</h2>
        <p>You've hit today's free message limit. Enter the passphrase to keep practicing.</p>
        <input id="pwInput" type="password" placeholder="Passphrase" autocomplete="off">
        <div class="row">
            <button id="pwCancel" type="button">Cancel</button>
            <button id="pwOk" class="primary" type="button">Unlock</button>
        </div>
    </div>
</div>

<script>
(function () {
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const ttsToggle = document.getElementById('ttsToggle');
    const modal = document.getElementById('modal');
    const pwInput = document.getElementById('pwInput');
    const mouthOpen = document.getElementById('mouthOpen');
    const mouthClosed = document.getElementById('mouthClosed');

    const messages = []; // {role, content} history sent to the API
    let password = sessionStorage.getItem('hansiPw') || null;
    let ttsOn = true;
    let pendingText = null; // message being retried after password entry
    let germanVoice = null;

    function pickVoice() {
        const voices = speechSynthesis.getVoices();
        germanVoice = voices.find(v => v.lang === 'de-DE') ||
            voices.find(v => v.lang && v.lang.startsWith('de')) || null;
    }
    if ('speechSynthesis' in window) {
        pickVoice();
        speechSynthesis.onvoiceschanged = pickVoice;
    } else {
        ttsToggle.style.display = 'none';
        ttsOn = false;
    }

    let mouthTimer = null;
    function startMouth() {
        stopMouth();
        let open = false;
        mouthTimer = setInterval(() => {
            open = !open;
            mouthOpen.style.display = open ? '' : 'none';
            mouthClosed.style.display = open ? 'none' : '';
        }, 140);
    }
    function stopMouth() {
        if (mouthTimer) clearInterval(mouthTimer);
        mouthTimer = null;
        mouthOpen.style.display = 'none';
        mouthClosed.style.display = '';
    }

    function speak(text) {
        if (!ttsOn || !('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        if (germanVoice) u.voice = germanVoice;
        u.rate = 0.85;
        u.onstart = startMouth;
        u.onend = stopMouth;
        u.onerror = stopMouth;
        speechSynthesis.speak(u);
    }

    function addBubble(cls, html) {
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }
    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    async function sendMessage(text) {
        send.disabled = true;
        const thinking = addBubble('thinking', 'Hansi denkt nach…');
        try {
            const body = { messages: messages.concat([{ role: 'user', content: text }]) };
            if (password) body.password = password;
            const res = await fetch('/api/german-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            thinking.remove();

            if (res.status === 429) {
                const data = await res.json().catch(() => ({}));
                if (data.needsPassword) {
                    pendingText = text;
                    pwInput.value = '';
                    modal.classList.add('open');
                    pwInput.focus();
                } else {
                    addBubble('hansi', esc("Puh! Ich brauche eine Pause. Komm morgen wieder! (Daily limit reached — come back tomorrow!)"));
                }
                return;
            }
            if (!res.ok) throw new Error('Request failed');

            const data = await res.json();
            messages.push({ role: 'user', content: text });
            messages.push({ role: 'assistant', content: JSON.stringify(data) });

            if (data.correction) {
                addBubble('correction',
                    '<span class="fixed">✏️ ' + esc(data.correction.corrected) + '</span>' +
                    esc(data.correction.explanation));
            }
            addBubble('hansi', esc(data.reply));
            speak(data.reply);
        } catch (err) {
            thinking.remove();
            addBubble('hansi', esc('Entschuldigung! Something went wrong — try again in a moment.'));
        } finally {
            send.disabled = false;
        }
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || send.disabled) return;
        input.value = '';
        addBubble('user', esc(text));
        sendMessage(text);
    });

    ttsToggle.addEventListener('click', function () {
        ttsOn = !ttsOn;
        ttsToggle.classList.toggle('muted', !ttsOn);
        if (!ttsOn) { speechSynthesis.cancel(); stopMouth(); }
    });

    document.getElementById('pwOk').addEventListener('click', function () {
        password = pwInput.value.trim();
        if (!password) return;
        sessionStorage.setItem('hansiPw', password);
        modal.classList.remove('open');
        if (pendingText) {
            const t = pendingText;
            pendingText = null;
            sendMessage(t);
        }
    });
    document.getElementById('pwCancel').addEventListener('click', function () {
        modal.classList.remove('open');
        pendingText = null;
    });

    // Opening greeting (no API call)
    const greeting = 'Servus! Ich bin Hansi. Wie geht es dir heute?';
    addBubble('hansi', esc(greeting) + '<br><span style="color:#888;font-size:13px">(Hi! I\'m Hansi. How are you today? Reply in German — I\'ll gently correct you as we chat.)</span>');
    messages.push({ role: 'assistant', content: JSON.stringify({ reply: greeting, correction: null }) });
    // Speak the greeting on first user interaction (browsers block autoplay audio)
    const speakOnce = () => { speak(greeting); document.removeEventListener('pointerdown', speakOnce); };
    document.addEventListener('pointerdown', speakOnce, { once: true });
})();
</script>
</body>
</html>
