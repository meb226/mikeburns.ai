<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sprich mit Hansi — German Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FAFAFA;
            color: #000;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            max-width: 640px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #E0E0E0;
            background: #FAFAFA;
        }
        header a {
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 16px;
        }
        header .title { font-size: 14px; color: #555; }
        header button {
            background: none;
            border: 1px solid #ccc;
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            color: #333;
        }
        header button.muted { opacity: 0.45; text-decoration: line-through; }

        /* Scene with Hansi */
        .scene {
            flex-shrink: 0;
            position: relative;
            line-height: 0;
            background: #7EC8F5;
        }
        .scene img {
            width: 100%;
            height: auto;
            max-height: 38dvh;
            object-fit: cover;
            object-position: 50% 12%;
            display: block;
            transform-origin: 50% 62%;
            animation: breathe 6.5s ease-in-out infinite;
        }
        #hansiTalking {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.22s ease;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1) translateX(0); }
            50% { transform: scale(1.014) translateX(1.5px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .scene img { animation: none; }
        }

        /* Chat */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.45;
            white-space: pre-wrap;
        }
        .msg.user {
            align-self: flex-end;
            background: #000;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.hansi {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #E0E0E0;
            border-bottom-left-radius: 4px;
        }
        .msg.correction {
            align-self: flex-start;
            background: #FFF7E0;
            border: 1px solid #F0DFA8;
            font-size: 13.5px;
            color: #4a3f14;
        }
        .msg.correction .fixed { font-weight: 600; display: block; margin-bottom: 3px; }
        .msg.thinking { color: #999; font-style: italic; background: #fff; border: 1px solid #eee; align-self: flex-start; }

        /* Input bar */
        .inputbar {
            display: flex;
            gap: 8px;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid #E0E0E0;
            background: #FAFAFA;
        }
        .inputbar input {
            flex: 1;
            font-family: inherit;
            font-size: 16px;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 24px;
            outline: none;
            background: #fff;
        }
        .inputbar input:focus { border-color: #000; }
        .inputbar button {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: #000;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .inputbar button:disabled { opacity: 0.4; }
        .inputbar button.mic {
            background: #fff;
            color: #333;
            border: 1px solid #ccc;
            font-size: 20px;
        }
        .inputbar button.mic.listening {
            background: #E5484D;
            color: #fff;
            border-color: #E5484D;
            animation: micPulse 1.2s infinite;
        }
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(229,72,77,0.5); }
            70% { box-shadow: 0 0 0 12px rgba(229,72,77,0); }
            100% { box-shadow: 0 0 0 0 rgba(229,72,77,0); }
        }

        /* Password modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
        }
        .modal h2 { font-size: 17px; margin-bottom: 8px; }
        .modal p { font-size: 14px; color: #555; margin-bottom: 16px; line-height: 1.5; }
        .modal input {
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
        .modal button {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }
        .modal button.primary { background: #000; color: #fff; border-color: #000; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <a href="/">Mike Burns</a>
        <span class="title">Sprich mit Hansi 🇩🇪</span>
        <button id="ttsToggle" title="Toggle voice">🔊 Voice</button>
    </header>

    <div class="scene" id="scene">
        <img id="hansiIdle" src="/german/hansi-idle.webp" alt="Hansi, a friendly Bavarian man in lederhosen in front of the Alps">
        <img id="hansiTalking" src="/german/hansi-talking.webp" alt="" aria-hidden="true">
    </div>

    <div class="chat" id="chat"></div>

    <form class="inputbar" id="form">
        <input id="input" type="text" placeholder="Schreib etwas auf Deutsch…" autocomplete="off" enterkeyhint="send">
        <button type="button" id="mic" class="mic" aria-label="Speak German">🎤</button>
        <button type="submit" id="send" aria-label="Send">➤</button>
    </form>
</div>

<div class="modal-backdrop" id="modal">
    <div class="modal">
        <h2>Daily limit reached</h2>
        <p>You've hit today's free message limit. Enter the passphrase to keep practicing.</p>
        <input id="pwInput" type="password" placeholder="Passphrase" autocomplete="off">
        <div class="row">
            <button id="pwCancel" type="button">Cancel</button>
            <button id="pwOk" class="primary" type="button">Unlock</button>
        </div>
    </div>
</div>

<script>
(function () {
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const ttsToggle = document.getElementById('ttsToggle');
    const modal = document.getElementById('modal');
    const pwInput = document.getElementById('pwInput');
    const talkFrame = document.getElementById('hansiTalking');

    const messages = []; // {role, content} history sent to the API
    let password = sessionStorage.getItem('hansiPw') || null;
    let ttsOn = true;
    let pendingText = null; // message being retried after password entry
    let germanVoice = null;
    let germanVoiceIsMale = false;

    // Common male German voice names across iOS/macOS/Windows/Android
    const MALE_NAMES = ['martin', 'markus', 'viktor', 'conrad', 'stefan', 'klaus', 'reed', 'jonas', 'björn', 'bernd', 'yannick'];
    function pickVoice() {
        const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('de'));
        const male = voices.find(v => MALE_NAMES.some(n => v.name.toLowerCase().includes(n)) ||
            v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('männlich'));
        germanVoice = male || voices.find(v => v.lang === 'de-DE') || voices[0] || null;
        germanVoiceIsMale = Boolean(male);
    }
    if ('speechSynthesis' in window) {
        pickVoice();
        speechSynthesis.onvoiceschanged = pickVoice;
    } else {
        ttsToggle.style.display = 'none';
        ttsOn = false;
    }

    // Shared audio element for cloud TTS; play/pause during the first user
    // gesture so iOS allows later programmatic playback.
    const audioEl = new Audio();
    let audioUnlocked = false;
    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
        audioEl.play().catch(() => {});
    }
    document.addEventListener('pointerdown', unlockAudio, { once: true });
    audioEl.addEventListener('playing', startMouth);
    audioEl.addEventListener('ended', stopMouth);
    audioEl.addEventListener('pause', stopMouth);

    let mouthTimer = null;
    function startMouth() {
        stopMouth();
        let open = false;
        const tick = () => {
            open = !open;
            talkFrame.style.opacity = open ? '1' : '0';
            // Hold each pose an organic, varied beat; linger longer on talking
            const hold = open ? 340 + Math.random() * 420 : 200 + Math.random() * 260;
            mouthTimer = setTimeout(tick, hold);
        };
        tick();
    }
    function stopMouth() {
        if (mouthTimer) clearTimeout(mouthTimer);
        mouthTimer = null;
        talkFrame.style.opacity = '0';
    }

    function stopSpeaking() {
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        audioEl.pause();
        stopMouth();
    }

    // Cloud TTS (male German voice) when the server has a key; browser voice otherwise
    let cloudTts = true;
    async function speak(text) {
        if (!ttsOn) return;
        stopSpeaking();
        if (cloudTts) {
            try {
                const res = await fetch('/api/german-tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (res.status === 404 || res.status === 501) {
                    cloudTts = false; // not configured — stop trying
                } else if (res.ok) {
                    const data = await res.json();
                    if (!ttsOn) return;
                    audioEl.src = 'data:audio/mp3;base64,' + data.audio;
                    audioEl.play().catch(() => browserSpeak(text));
                    return;
                }
            } catch (err) { /* fall through to browser voice */ }
        }
        browserSpeak(text);
    }

    function browserSpeak(text) {
        if (!ttsOn || !('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        if (germanVoice) u.voice = germanVoice;
        u.rate = 0.85;
        // Only a female voice available: lower the pitch toward a male register
        if (!germanVoiceIsMale) u.pitch = 0.7;
        u.onstart = startMouth;
        u.onend = stopMouth;
        u.onerror = stopMouth;
        speechSynthesis.speak(u);
    }

    function addBubble(cls, html) {
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }
    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    async function sendMessage(text) {
        send.disabled = true;
        const thinking = addBubble('thinking', 'Hansi denkt nach…');
        try {
            const body = { messages: messages.concat([{ role: 'user', content: text }]) };
            if (password) body.password = password;
            const res = await fetch('/api/german-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            thinking.remove();

            if (res.status === 429) {
                const data = await res.json().catch(() => ({}));
                if (data.needsPassword) {
                    pendingText = text;
                    pwInput.value = '';
                    modal.classList.add('open');
                    pwInput.focus();
                } else {
                    addBubble('hansi', esc("Puh! Ich brauche eine Pause. Komm morgen wieder! (Daily limit reached — come back tomorrow!)"));
                }
                return;
            }
            if (!res.ok) throw new Error('Request failed');

            const data = await res.json();
            messages.push({ role: 'user', content: text });
            messages.push({ role: 'assistant', content: JSON.stringify(data) });

            if (data.correction) {
                addBubble('correction',
                    '<span class="fixed">✏️ ' + esc(data.correction.corrected) + '</span>' +
                    esc(data.correction.explanation));
            }
            addBubble('hansi', esc(data.reply));
            speak(data.reply);
        } catch (err) {
            thinking.remove();
            addBubble('hansi', esc('Entschuldigung! Something went wrong — try again in a moment.'));
        } finally {
            send.disabled = false;
        }
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || send.disabled) return;
        input.value = '';
        addBubble('user', esc(text));
        sendMessage(text);
    });

    ttsToggle.addEventListener('click', function () {
        ttsOn = !ttsOn;
        ttsToggle.classList.toggle('muted', !ttsOn);
        if (!ttsOn) stopSpeaking();
    });

    // Mic input: browser speech recognition in German
    const micBtn = document.getElementById('mic');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let listening = false;
    function setListening(on) {
        listening = on;
        micBtn.classList.toggle('listening', on);
        input.placeholder = on ? 'Ich höre zu… sprich!' : 'Schreib etwas auf Deutsch…';
    }
    if (!SR) {
        micBtn.style.display = 'none';
    } else {
        rec = new SR();
        rec.lang = 'de-DE';
        rec.interimResults = true;
        rec.maxAlternatives = 1;
        rec.onresult = function (e) {
            let text = '';
            for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
            input.value = text;
        };
        rec.onend = function () {
            setListening(false);
            const text = input.value.trim();
            if (text && !send.disabled) {
                input.value = '';
                addBubble('user', esc(text));
                sendMessage(text);
            }
        };
        rec.onerror = function (e) {
            setListening(false);
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                addBubble('hansi', esc('Ich kann dich nicht hören! Please allow microphone access in your browser and try again.'));
            }
        };
        micBtn.addEventListener('click', function () {
            if (listening) { rec.stop(); return; }
            stopSpeaking();
            input.value = '';
            setListening(true);
            try { rec.start(); } catch (err) { setListening(false); }
        });
    }

    document.getElementById('pwOk').addEventListener('click', function () {
        password = pwInput.value.trim();
        if (!password) return;
        sessionStorage.setItem('hansiPw', password);
        modal.classList.remove('open');
        if (pendingText) {
            const t = pendingText;
            pendingText = null;
            sendMessage(t);
        }
    });
    document.getElementById('pwCancel').addEventListener('click', function () {
        modal.classList.remove('open');
        pendingText = null;
    });

    // Opening greeting (no API call)
    const greeting = 'Servus! Ich bin Hansi. Wie geht es dir heute?';
    addBubble('hansi', esc(greeting) + '<br><span style="color:#888;font-size:13px">(Hi! I\'m Hansi. How are you today? Reply in German — I\'ll gently correct you as we chat.)</span>');
    messages.push({ role: 'assistant', content: JSON.stringify({ reply: greeting, correction: null }) });
    // Speak the greeting on first user interaction (browsers block autoplay audio)
    const speakOnce = () => { speak(greeting); document.removeEventListener('pointerdown', speakOnce); };
    document.addEventListener('pointerdown', speakOnce, { once: true });
})();
</script>
</body>
</html>
