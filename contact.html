<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mike Burns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FAFAFA;
            color: #000000;
            line-height: 1.6;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Fixed top navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #FAFAFA;
            border-bottom: 1px solid #E0E0E0;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        nav h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        nav h1 a {
            text-decoration: none;
            color: #000000;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: #000000;
            font-size: 16px;
            font-weight: 400;
            position: relative;
            padding-bottom: 4px;
        }

        /* Animated underline on nav links */
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: #000000;
            transition: width 150ms ease-out;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Centered content */
        .content-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 140px 48px 32px 48px;
            text-align: center;
        }

        .page-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 20px;
            font-weight: 400;
            color: #000000;
            margin-bottom: 48px;
        }

        /* CTA Button */
        .cta-button {
            display: block;
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            background: #DC143C;
            border: 1px solid #DC143C;
            padding: 16px 40px;
            width: 200px;
            text-align: center;
            margin: 0 auto;
            /* 3px border radius */
            border-radius: 3px;
            /* Button micro-interactions */
            transition: all 150ms ease-out;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        /* Scale + stronger shadow on hover */
        .cta-button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            background: #0039A6;
            border-color: #0039A6;
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            padding: 60px 48px;
            font-size: 14px;
            font-weight: 400;
            color: #666666;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 16px;
                padding: 20px 24px;
            }

            nav ul {
                gap: 24px;
            }

            .content-wrapper {
                padding: 160px 24px 24px 24px;
            }

            .page-title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
            }

            .cta-button {
                font-size: 15px;
                padding: 14px 32px;
            }

            /* Disable hover effects on mobile */
            .cta-button:hover {
                transform: none;
                background: #DC143C;
                border-color: #DC143C;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            }
        }
    </style>
</head>
<body>
    <nav>
        <h1><a href="index.html">Mike Burns</a></h1>
        <ul>
            <li><a href="index.html">Work</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <div class="content-wrapper">
        <h1 class="page-title">Contact</h1>
        <p class="subtitle">Let's connect.</p>
        <a href="/cdn-cgi/l/email-protection#e08d898b858295928e93d2d2d6a0878d81898cce838f8d" class="cta-button">Send e-mail</a>
    </div>

    <footer>
        <p>© 2025
